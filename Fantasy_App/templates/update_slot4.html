<h2>Update Slot 4 (Rating 3-4)</h2>

<form method="POST">
    {% csrf_token %}
    <select name="golfer">
        {% for g in golfers %}
            <option value="{{ g.id }}">{{ g.name }} (Rating: {{ g.rating }})</option>
        {% endfor %}
    </select>

    <button type="submit">Save Selection</button>
</form>
