<!DOCTYPE html>
<html>
<head>
    <title>Change Favorite Team</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        /* ---------------- TOP NAV ---------------- */
        .navbar {
            background: #1e1e1e;
            color: white;
            padding: 15px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .navbar .left {
            font-size: 22px;
            font-weight: bold;
        }
        .navbar a {
            color: #ddd;
            margin-left: 20px;
            text-decoration: none;
            font-size: 18px;
        }
        .navbar a:hover {
            color: #fff;
        }

        /* ----------------- PAGE CONTENT ----------------- */
        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 25px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        h2 {
            margin-top: 0;
            border-bottom: 2px solid #ccc;
            padding-bottom: 6px;
        }

        /* ----------------- FORM STYLING ----------------- */
        label {
            font-size: 18px;
        }

        select {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            font-size: 18px;
            border-radius: 6px;
            border: 1px solid #bbb;
        }

        button {
            padding: 10px 22px;
            background: #0077cc;
            color: white;
            font-size: 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #005fa3;
        }

        /* --------------- FOOTER -------------- */
        .footer {
            text-align: center;
            margin-top: 35px;
        }

        .footer a {
            color: #cc0000;
            font-weight: bold;
            font-size: 18px;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>


<body>

    <!-- TOP NAV -->
    <div class="navbar">
        <div class="left">Hello {{ user.username }}!</div>

        <div class="right">
            <a href="/dashboard/">Back to Dashboard</a>
        </div>
    </div>


    <!-- MAIN CONTENT -->
    <div class="container">
        <h2>Change Your Favorite Team</h2>

        <form method="POST">
            {% csrf_token %}

            <label for="favorite_team"><strong>Select Your Favorite Team:</strong></label>
            <select name="favorite_team" id="favorite_team" required>
                <option value="">-- Choose a Team --</option>

                {% for team in teams %}
                    <option value="{{ team.id }}"
                        {% if profile.favorite_team and profile.favorite_team.id == team.id %}
                            selected
                        {% endif %}
                    >
                        {{ team.name }}
                    </option>
                {% endfor %}
            </select>

            <button type="submit">Save Favorite Team</button>
        </form>

        <div class="footer">
            <br>
            <a href="{% url 'logout' %}">Logout</a>
        </div>
    </div>

</body>
</html>
